spring.application.name=cubing-backend

# Datasource = how Spring opens connections to PostgreSQL.
# HikariCP (built in) pools connections for reuse.
spring.datasource.url=jdbc:postgresql://localhost:5432/cubr
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# validate = Hibernate checks entities match DB at startup.
# Does NOT create or alter tables — Flyway owns that.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true